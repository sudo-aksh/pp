<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #f5f5f5;
        }

        .navbar {
            background: #212529;
        }

        .card {
            border: 1px solid #ddd;
        }

        .progress {
            height: 25px;
        }
    </style>
</head>

<body>



<!-- Main Content -->
<div class="container py-4">

    <h2 class="mb-4">
        Dashboard
    </h2>


    <!-- Quick Actions -->
    <div class="card p-4 mb-4">

        <h5>
            Quick Actions
        </h5>

        <p class="text-muted">
            Manage students and attendance.
        </p>

        <div class="d-flex gap-2">

            <a href="/add_student" class="btn btn-primary">
                Add Student
            </a>

            <a href="/mark_attendance" class="btn btn-success">
                Mark Attendance
            </a>

            <a href="/attendance_record" class="btn btn-warning">
                View Records
            </a>

        </div>

    </div>


    <!-- Train Model -->
    <div class="card p-4 mb-4">

        <div class="d-flex justify-content-between align-items-center">

            <div>
                <h5 class="mb-1">
                    Train Face Recognition Model
                </h5>

                <p class="text-muted mb-0">
                    Train the model using registered students.
                </p>
            </div>

            <button
                id="trainBtn"
                class="btn btn-primary"
            >
                Start Training
            </button>

        </div>


        <div class="mt-4">

            <div class="progress">

                <div
                    id="trainProgress"
                    class="progress-bar"
                    style="width: 0%;"
                >
                    0%
                </div>

            </div>

            <div
                id="trainMsg"
                class="mt-2 text-muted"
            >
                Model not trained yet.
            </div>

        </div>

    </div>


    <!-- Attendance Chart -->
    <div class="card p-4">

        <h5>
            Attendance - Last 30 Days
        </h5>

        <div
            style="
                position: relative;
                height: 300px;
                width: 100%;
            "
        >

            <canvas id="attendanceChart"></canvas>

        </div>

    </div>

</div>


<script src="/static/js/dashboard.js"></script>

</body>
</html>
