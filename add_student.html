<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Add Student</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card p-4 shadow-sm">


                <!-- ================================================= -->
                <!-- TITLE -->
                <!-- ================================================= -->

                <h3 class="mb-4 text-center">
                    Add Student
                </h3>


                <!-- ================================================= -->
                <!-- STUDENT INFORMATION -->
                <!-- ================================================= -->

                <form id="studentForm">


                    <!-- NAME -->

                    <div class="mb-3">

                        <label
                            for="name"
                            class="form-label"
                        >
                            Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="name"
                            id="name"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="mb-3">

                        <label
                            for="department"
                            class="form-label"
                        >
                            Department
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="department"
                            id="department"
                            placeholder="Example: Computer Science"
                            required
                        >

                    </div>


                    <!-- BRANCH -->

                    <div class="mb-3">

                        <label
                            for="branch"
                            class="form-label"
                        >
                            Branch
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="branch"
                            id="branch"
                            placeholder="Example: BCA"
                            required
                        >

                    </div>


                    <!-- TELEGRAM CHAT ID -->

                    <div class="mb-3">

                        <label
                            for="telegram_chat_id"
                            class="form-label"
                        >
                            Telegram Chat ID
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="telegram_chat_id"
                            id="telegram_chat_id"
                            placeholder="Enter Telegram Chat ID"
                            required
                        >

                        <div class="form-text">
                            Example: 123456789
                        </div>

                    </div>


                    <!-- SAVE INFORMATION -->

                    <button
                        id="saveInfoBtn"
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Save Information
                    </button>


                </form>


                <!-- ================================================= -->
                <!-- STUDENT CREATED -->
                <!-- ================================================= -->

                <div
                    id="studentInfo"
                    class="alert alert-success mt-4"
                    style="display: none;"
                >

                    <strong>
                        Student Created Successfully
                    </strong>

                    <br>

                    Student ID:

                    <span
                        id="studentId"
                        class="fw-bold"
                    ></span>

                    <br>

                    Name:

                    <span
                        id="createdStudentName"
                        class="fw-bold"
                    ></span>

                </div>


                <hr class="my-4">


                <!-- ================================================= -->
                <!-- CAMERA -->
                <!-- ================================================= -->

                <div class="text-center">


                    <h5 class="mb-3">
                        Capture Photos
                    </h5>


                    <!-- VIDEO -->

                    <video
                        id="video"
                        width="560"
                        height="420"
                        autoplay
                        muted
                        playsinline
                        style="
                            max-width: 100%;
                            border-radius: 10px;
                            border: 2px solid #ddd;
                            background: #000;
                        "
                    ></video>


                    <!-- CANVAS -->

                    <canvas
                        id="canvas"
                        width="560"
                        height="420"
                        style="display: none;"
                    ></canvas>


                    <!-- ================================================= -->
                    <!-- CAPTURE STATUS -->
                    <!-- ================================================= -->

                    <div class="mt-3">

                        <div
                            id="captureStatus"
                            class="small text-muted"
                        >
                            Captured 0 / 50
                        </div>


                        <div
                            class="progress mt-2"
                            style="height: 12px;"
                        >

                            <div
                                id="progressBar"
                                class="progress-bar bg-success"
                                style="width: 0%;"
                            ></div>

                        </div>

                    </div>


                    <!-- ================================================= -->
                    <!-- BUTTONS -->
                    <!-- ================================================= -->

                    <div
                        class="mt-3 d-flex gap-2 justify-content-center flex-wrap"
                    >


                        <!-- START CAPTURE -->

                        <button
                            id="startCaptureBtn"
                            type="button"
                            class="btn btn-warning"
                            disabled
                        >
                            Start Capture
                        </button>


                        <!-- STOP CAPTURE -->

                        <button
                            id="stopCaptureBtn"
                            type="button"
                            class="btn btn-danger"
                            disabled
                        >
                            Stop Capture
                        </button>


                        <!-- ADD STUDENT -->

                        <button
                            id="addStudentBtn"
                            type="button"
                            class="btn btn-success"
                            disabled
                        >
                            Add Student
                        </button>


                    </div>


                    <!-- CAMERA STATUS -->

                    <div
                        id="cameraStatus"
                        class="small text-muted mt-3"
                    >
                        Save student information first.
                    </div>


                </div>


            </div>

        </div>

    </div>

</div>


<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script
    src="{{ url_for('static', filename='js/camera_add_student.js') }}"
></script>


</body>

</html>
